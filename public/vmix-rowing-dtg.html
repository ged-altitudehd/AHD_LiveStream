<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
    <title>vMix — Distance to go</title>
    <link rel="preload" href="assets/fonts/milford/Montserrat-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="vmix-rowing-l3.css?v=7">
</head>
<body class="rl3-page dtg-page">
    <!-- 1920×1080, transparent. A translucent strip lying on the water along the buoy line, with the
         metres to go counting down on the same plane. Placement and feed: see vmix-rowing-dtg.js. -->
    <div class="rl3-stage" id="rl3Stage">
        <div class="dtg-strip" id="dtgStrip" aria-label="Distance to go">
            <span class="dtg-value" id="dtgValue" data-field="race.distanceToGo">2,000</span>
            <span class="dtg-unit">m to go</span>
        </div>
        <svg class="dtg-guides" id="dtgGuides" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
    </div>
    <script src="vmix-rowing-dtg.js?v=1"></script>
</body>
</html>
